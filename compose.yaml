name: mobile-agent-console

services:
  tmux-volume-init:
    image: alpine:3.22
    user: "0:0"
    command: ["chown", "10001:10001", "/tmux"]
    volumes:
      - tmux-socket:/tmux
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]

  tmux-runtime:
    build:
      context: deploy/tmux-runtime
    init: true
    user: "10001:10001"
    volumes:
      - tmux-socket:/tmux
      - ${MAC_WORKSPACE_ROOT:-./workspace}:/workspace
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      tmux-volume-init:
        condition: service_completed_successfully

  backend:
    build:
      context: backend
      target: base
    user: "10001:10001"
    environment:
      MAC_HOST: 0.0.0.0
      MAC_PORT: 8080
      MAC_LOGIN_PASSWORD_FILE: /run/secrets/mac_login_password
      MAC_SESSION_SECRET_FILE: /run/secrets/mac_session_secret
      MAC_COOKIE_SECURE: ${MAC_COOKIE_SECURE:-false}
      MAC_CORS_ORIGINS: ${MAC_CORS_ORIGINS:-http://127.0.0.1:8081}
      MAC_TMUX_SOCKET: mobile-agent-console
      MAC_TMUX_SOCKET_PATH: /tmux
      MAC_ALLOWED_ROOTS: '["/workspace"]'
      MAC_WORKSPACE_PRESETS: ${MAC_WORKSPACE_PRESETS:-}
      MAC_ATTACHMENTS_ROOT: /workspace/.agent-attachments
      MAC_ATTACHMENTS_PROMPT_ROOT: /workspace/.agent-attachments
      MAC_ARTIFACTS_ROOT: /workspace/.agent-artifacts
      MAC_ARTIFACTS_PROMPT_ROOT: /workspace/.agent-artifacts
      MAC_SNAPSHOTS_ROOT: /workspace/.agent-snapshots
      MAC_BACKUPS_ROOT: /workspace/.mobile-agent-console/backups
      MAC_BACKUP_RETENTION: ${MAC_BACKUP_RETENTION:-10}
      MAC_PROVIDER_RATE_LIMITS_PATH: /workspace/.mobile-agent-console/provider-rate-limits.json
      MAC_PROVIDER_RATE_LIMITS_HISTORY_PATH: /workspace/.mobile-agent-console/provider-rate-limits-history.jsonl
      MAC_SESSION_USAGE_ENABLED: ${MAC_SESSION_USAGE_ENABLED:-false}
      MAC_SESSION_USAGE_PATH: /workspace/.mobile-agent-console/session-usage-history.jsonl
      MAC_PROVIDER_SESSION_STATES_PATH: /workspace/.mobile-agent-console/provider-session-states.json
      MAC_CLAUDE_HISTORY_ENABLED: ${MAC_CLAUDE_HISTORY_ENABLED:-false}
      MAC_CLAUDE_HISTORY_PATH: /workspace/.mobile-agent-console/claude-history.json
      MAC_DATABASE_PATH: /workspace/.mobile-agent-console/app.db
      MAC_DATABASE_AUTH_ENABLED: "true"
      MAC_BOOTSTRAP_USERNAME: ${MAC_BOOTSTRAP_USERNAME:-admin}
      MAC_MAX_ATTACHMENT_BYTES: ${MAC_MAX_ATTACHMENT_BYTES:-10485760}
      MAC_MAX_ATTACHMENT_BYTES_PER_SESSION: ${MAC_MAX_ATTACHMENT_BYTES_PER_SESSION:-104857600}
      MAC_MAX_ARTIFACT_BYTES: ${MAC_MAX_ARTIFACT_BYTES:-26214400}
      MAC_ATTACHMENT_TTL_SECONDS: ${MAC_ATTACHMENT_TTL_SECONDS:-86400}
      MAC_AGENT_ACTIVE_WINDOW_SECONDS: ${MAC_AGENT_ACTIVE_WINDOW_SECONDS:-8}
      MAC_PUSH_VAPID_KEY_PATH: /workspace/.mobile-agent-console/vapid_private_key.pem
      MAC_PUSH_CONTACT_EMAIL: ${MAC_PUSH_CONTACT_EMAIL:-admin@localhost}
      MAC_PUSH_POLL_INTERVAL_SECONDS: ${MAC_PUSH_POLL_INTERVAL_SECONDS:-5}
    secrets: [mac_login_password, mac_session_secret]
    volumes:
      - tmux-socket:/tmux
      - ${MAC_WORKSPACE_ROOT:-./workspace}:/workspace
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      tmux-runtime:
        condition: service_started
        required: false
    restart: unless-stopped

  web:
    build:
      context: frontend
    # Bind only to loopback or the explicit Tailscale IP; never use 0.0.0.0 here.
    ports: ["${MAC_BIND_IP:-127.0.0.1}:${MAC_BIND_PORT:-8081}:8080"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run"]
    security_opt: ["no-new-privileges:true"]
    secrets: [mac_tls_cert, mac_tls_key]
    depends_on: [backend]
    restart: unless-stopped

  backend-test:
    profiles: [test]
    build:
      context: backend
      target: test
    volumes:
      - type: bind
        source: ./frontend/tests/fixtures
        target: /frontend/tests/fixtures
        read_only: true
      - type: bind
        source: ./deploy/rate-limit-collector.py
        target: /deploy/rate-limit-collector.py
        read_only: true
    environment:
      MAC_LOGIN_PASSWORD: test-password-at-least-16
      MAC_SESSION_SECRET: test-session-secret-at-least-16

  frontend-build:
    profiles: [test]
    build:
      context: frontend
      target: build
    command: ["npm", "run", "build"]

volumes:
  tmux-socket:

secrets:
  mac_login_password:
    file: ./.secrets/login_password
  mac_session_secret:
    file: ./.secrets/session_secret
  mac_tls_cert:
    file: ${MAC_TLS_CERT_FILE:-./.secrets/tls/tailscale.crt}
  mac_tls_key:
    file: ${MAC_TLS_KEY_FILE:-./.secrets/tls/tailscale.key}
