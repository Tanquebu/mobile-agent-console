map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080 ssl;
    server_name _;
    client_max_body_size 11m;
    root /usr/share/nginx/html;
    index index.html;

    # Certificato Tailscale (tailscale cert): un contesto sicuro è
    # obbligatorio per Notification/ServiceWorker, non solo un vezzo — vedi
    # docs/adr/008-tailscale-cert-tls.md.
    ssl_certificate /run/secrets/mac_tls_cert;
    ssl_certificate_key /run/secrets/mac_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
